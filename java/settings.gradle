pluginManagement {
    repositories {
        // Prefer a public Maven Central mirror to avoid shared-runner rate limits.
        maven {
            name = 'GoogleMavenCentralMirror'
            url = uri('https://maven-central.storage-download.googleapis.com/maven2/')
        }
        mavenCentral()
        gradlePluginPortal()
    }
}

